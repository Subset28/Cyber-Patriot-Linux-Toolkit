name: linux-toolkit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run test suite
        run: bash tests/run-tests.sh

  dry-run-and-apply:
    # Runs on a throwaway Ubuntu VM: fake accounts, a fixture README, a dry run of every module,
    # then a real apply of the account, SSH, firewall, sysctl, password, and software modules.
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build a fake competition image
        run: |
          sudo useradd -m -s /bin/bash benjamin
          sudo useradd -m -s /bin/bash attacker
          sudo apt-get install -y nmap
          mkdir -p "$HOME/Desktop"
          cp tests/fixtures/README.txt "$HOME/Desktop/README.txt"
      - name: README as the toolkit reads it
        run: |
          sudo bash cp_harden.sh --show < /dev/null | tee show.txt
          grep -q "benjamin" show.txt
          grep -qi "ssh" show.txt
          grep -q "Wireshark" show.txt || true
      - name: Dry run every module (nothing changes)
        run: |
          sudo bash cp_harden.sh --no-pause < /dev/null > dryrun.txt 2>&1 || true
          tail -n 40 dryrun.txt
          ! grep -q "\[FAILED\]" dryrun.txt
      - name: Apply account, SSH, firewall, sysctl, password and software modules
        run: |
          sudo bash cp_harden.sh --apply --only users,auth,ssh,sysctl,firewall,packages --no-pause < /dev/null > apply.txt 2>&1 || true
          cat apply.txt
          ! grep -q "\[FAILED\]" apply.txt
      - name: "Sudo - require a password for a picked NOPASSWD rule"
        run: |
          # Test rule for a fake admin. Pick 1 is this rule (cp-ci-test sorts before runner in /etc/sudoers.d).
          echo 'benjamin ALL=(ALL) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/cp-ci-test >/dev/null
          sudo chmod 0440 /etc/sudoers.d/cp-ci-test
          printf '1
' | sudo bash cp_harden.sh --apply --only sudoers --no-pause > sudoers.txt 2>&1 || true
          cat sudoers.txt
          ! sudo grep -q NOPASSWD /etc/sudoers.d/cp-ci-test
          sudo grep -q 'ALL=(ALL) ALL' /etc/sudoers.d/cp-ci-test
          sudo visudo -c
          # The runner's own rule is not picked, so it keeps its NOPASSWD.
          sudo grep -q NOPASSWD /etc/sudoers.d/runner
      - name: Check the results on the machine
        run: |
          # Unauthorized account gone; authorized admin in sudo with aging set.
          ! id attacker >/dev/null 2>&1
          id -nG benjamin | grep -qw sudo
          sudo chage -l benjamin | grep -q 'Maximum number of days between password change.*: 90'
          # SSH: root login off, and sshd still runs (it was never stopped).
          sudo grep -q '^PermitRootLogin no' /etc/ssh/sshd_config
          systemctl is-active --quiet ssh || systemctl is-active --quiet sshd
          # Firewall: ufw active with the SSH rule in place.
          sudo ufw status | grep -q 'Status: active'
          sudo ufw status | grep -q '22/tcp'
          # Kernel network settings written and loaded.
          test -f /etc/sysctl.d/99-cp-hardening.conf
          sudo sysctl -n net.ipv4.conf.all.accept_redirects | grep -qx 0
          # Password policy.
          grep -qE '^PASS_MAX_DAYS[[:space:]]+90' /etc/login.defs
          grep -q 'minlen = 12' /etc/security/pwquality.conf
          grep -q 'deny = 5' /etc/security/faillock.conf
          # Prohibited software: nmap is listed by name, and nothing was removed without a pick.
          grep -q 'nmap' apply.txt
          dpkg -s nmap >/dev/null 2>&1
      - name: Debug dump (always runs)
        if: always()
        run: |
          echo "--- sshd -t on the restored config:"; sudo sshd -t 2>&1; echo "rc=$?"
          echo "--- sshd_config (restored):"; sudo cat /etc/ssh/sshd_config
          echo "--- sshd_config.d:"; sudo ls -la /etc/ssh/sshd_config.d/ 2>&1; sudo cat /etc/ssh/sshd_config.d/*.conf 2>/dev/null
          echo "--- run folder command log:"; sudo sh -c 'cat /root/cp-reports/run-*/commands.log' 2>/dev/null | tail -n 60
          echo "--- run folder run.log:"; sudo sh -c 'cat /root/cp-reports/run-*/run.log' 2>/dev/null | tail -n 60
          echo "--- /run/sshd:"; ls -ld /run/sshd 2>&1
