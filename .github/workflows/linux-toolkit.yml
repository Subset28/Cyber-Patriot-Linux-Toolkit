name: linux-toolkit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run test suite
        run: bash tests/run-tests.sh

  dry-run-and-apply:
    # Runs on a throwaway Ubuntu VM: fake accounts, a fixture README, a dry run of every module,
    # then a real apply of the account, SSH, firewall, sysctl, password, and software modules.
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build a fake competition image
        run: |
          sudo useradd -m -s /bin/bash benjamin
          sudo useradd -m -s /bin/bash attacker
          sudo apt-get install -y nmap
          mkdir -p "$HOME/Desktop"
          cp tests/fixtures/README.txt "$HOME/Desktop/README.txt"
      - name: README as the toolkit reads it
        run: |
          sudo bash cp_harden.sh --show < /dev/null | tee show.txt
          grep -q "benjamin" show.txt
          grep -qi "ssh" show.txt
          grep -q "Wireshark" show.txt || true
      - name: Dry run every module (nothing changes)
        run: |
          sudo bash cp_harden.sh --no-pause < /dev/null > dryrun.txt 2>&1 || true
          tail -n 40 dryrun.txt
          ! grep -q "\[FAILED\]" dryrun.txt
      - name: Apply account, SSH, firewall, sysctl, password and software modules
        run: |
          # Throwaway VM: remove the image's extra account so the only unauthorized one is attacker.
          sudo userdel -r packer 2>/dev/null || true
          # Pick 1 in the users step is the unauthorized account list (attacker). Later prompts get no input.
          echo 1 | sudo bash cp_harden.sh --apply --only users,auth,ssh,sysctl,firewall,packages --no-pause > apply.txt 2>&1 || true
          cat apply.txt
          ! grep -q "\[FAILED\]" apply.txt
      - name: "Sudo - require a password for a picked NOPASSWD rule"
        run: |
          # Throwaway VM only. The image's cloud-init rule sorts before the test rule, so remove it first;
          # then the test rule is pick 1 (the runner's rule sorts after it and is not picked).
          sudo rm -f /etc/sudoers.d/90-cloud-init-users
          echo 'benjamin ALL=(ALL) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/cp-ci-test >/dev/null
          sudo chmod 0440 /etc/sudoers.d/cp-ci-test
          echo 1 | sudo bash cp_harden.sh --apply --only sudoers --no-pause > sudoers.txt 2>&1 || true
          cat sudoers.txt
          ! sudo grep -q NOPASSWD /etc/sudoers.d/cp-ci-test
          sudo grep -q 'ALL=(ALL) ALL' /etc/sudoers.d/cp-ci-test
          sudo visudo -c
          # The runner's own rule is not picked, so it keeps its NOPASSWD.
          sudo grep -q NOPASSWD /etc/sudoers.d/runner
      - name: "Module checks - each module on its own with fixtures"
        run: |
          set -u
          # Fixtures: one media file in Music, one folder in Downloads, one suspicious script in Downloads.
          mkdir -p "$HOME/Music" "$HOME/Downloads/cp-junk-folder"
          echo 'x' > "$HOME/Music/fixture-track.mp3"
          echo 'x' > "$HOME/Downloads/cp-junk-folder/file.txt"
          echo 'echo hi' > "$HOME/Downloads/evil.sh"
          newest() { sudo sh -c 'ls -td /root/cp-reports/run-*/ | head -n 1'; }

          echo "== perms"
          sudo bash cp_harden.sh --apply --only perms --no-pause < /dev/null > perms.txt 2>&1
          test "$(sudo stat -c '%U:%G %a' /etc/shadow)" = "root:shadow 640"
          test "$(sudo stat -c '%U:%G %a' /etc/passwd)" = "root:root 644"

          echo "== logging"
          sudo bash cp_harden.sh --apply --only logging --no-pause < /dev/null > logging.txt 2>&1 || true
          cat logging.txt
          sudo ls -l /etc/audit/rules.d/ 2>&1 || true
          systemctl status auditd --no-pager 2>&1 | head -n 25 || true
          sudo test -f /etc/audit/rules.d/cp-toolkit.rules
          systemctl is-active --quiet auditd

          echo "== guest"
          sudo bash cp_harden.sh --apply --only guest --no-pause < /dev/null > guest.txt 2>&1
          grep -q "display manager is" guest.txt

          echo "== services (critical SSH must stay running; no pick given)"
          sudo bash cp_harden.sh --apply --only services --no-pause < /dev/null > services.txt 2>&1
          systemctl is-active --quiet ssh || systemctl is-active --quiet sshd

          # Pick numbers come from each module's own dry-run list, so other files on the image cannot shift them.
          plain_index() { grep '^    /' "$1" | grep -n -- "$2" | head -n 1 | cut -d: -f1; }
          numbered_index() { grep -- "$2" "$1" | head -n 1 | sed -E 's/^ *([0-9]+)\).*/\1/'; }

          echo "== media (the Music file)"
          sudo bash cp_harden.sh --only media --no-pause < /dev/null > media-dry.txt 2>&1
          n=$(plain_index media-dry.txt fixture-track.mp3); test -n "$n"
          echo "$n" | sudo bash cp_harden.sh --apply --only media --no-pause > media.txt 2>&1
          cat media.txt
          test ! -e "$HOME/Music/fixture-track.mp3"

          echo "== removepaths (the Downloads folder)"
          sudo bash cp_harden.sh --only removepaths --no-pause < /dev/null > rp-dry.txt 2>&1
          n=$(plain_index rp-dry.txt cp-junk-folder); test -n "$n"
          grep -qE "^[0-9]+$" <<< "$n"
          echo "$n" | sudo bash cp_harden.sh --apply --only removepaths --no-pause > removepaths.txt 2>&1
          cat removepaths.txt
          test ! -e "$HOME/Downloads/cp-junk-folder"

          echo "== userfiles (evil.sh)"
          sudo bash cp_harden.sh --only userfiles --no-pause < /dev/null > uf-dry.txt 2>&1
          n=$(plain_index uf-dry.txt evil.sh); test -n "$n"
          echo "$n" | sudo bash cp_harden.sh --apply --only userfiles --no-pause > userfiles.txt 2>&1
          cat userfiles.txt
          test ! -e "$HOME/Downloads/evil.sh"

          echo "== review (report and pick lists; no picks given, nothing removed)"
          sudo bash cp_harden.sh --apply --only review --no-pause < /dev/null > review.txt 2>&1
          grep -q "Top of /" review.txt
          ! grep -q "\[FAILED\]" review.txt

          echo "== audit and malware (report only, files saved to the run folder)"
          sudo bash cp_harden.sh --apply --only audit,malware --no-pause < /dev/null > audit.txt 2>&1
          sudo test -f "$(newest)/malware-check.txt"
          sudo find /root/cp-reports -name 'suid.txt' | grep -q .

          echo "== hosts (the fixture redirect line)"
          echo "0.0.0.0 fixture-bad.example" | sudo tee -a /etc/hosts >/dev/null
          sudo bash cp_harden.sh --only hosts --no-pause < /dev/null > hosts-dry.txt 2>&1
          n=$(awk '/^      line /{i++} /fixture-bad/{print i; exit}' hosts-dry.txt); test -n "$n"
          echo "$n" | sudo bash cp_harden.sh --apply --only hosts --no-pause > hosts.txt 2>&1
          cat hosts.txt
          ! grep -q fixture-bad /etc/hosts
          grep -q localhost /etc/hosts
          echo "== prohibited launcher (dry run lists it; nothing removed without a pick)"
          echo "[Desktop Entry]" > "$HOME/Desktop/ophcrack.desktop"
          echo "Name=ophcrack" >> "$HOME/Desktop/ophcrack.desktop"
          sudo bash cp_harden.sh --only packages --no-pause < /dev/null > pkgfiles-dry.txt 2>&1
          grep -qi "ophcrack" pkgfiles-dry.txt
          test -e "$HOME/Desktop/ophcrack.desktop"
          echo "== forensics (report only)"
          sudo bash cp_harden.sh --apply --only forensics --no-pause < /dev/null > forensics.txt 2>&1
          grep -q "Forensics questions" forensics.txt
      - name: Check the results on the machine
        run: |
          # Unauthorized account gone; authorized admin in sudo with aging set.
          ! id attacker >/dev/null 2>&1
          id -nG benjamin | grep -qw sudo
          sudo chage -l benjamin | grep -q 'Maximum number of days between password change.*: 90'
          # SSH: root login off, and sshd still runs (it was never stopped).
          sudo grep -q '^PermitRootLogin no' /etc/ssh/sshd_config
          systemctl is-active --quiet ssh || systemctl is-active --quiet sshd
          # Firewall: ufw active with the SSH rule in place.
          sudo ufw status | grep -q 'Status: active'
          sudo ufw status | grep -q '22/tcp'
          # Kernel network settings written and loaded.
          test -f /etc/sysctl.d/99-cp-hardening.conf
          sudo sysctl -n net.ipv4.conf.all.accept_redirects | grep -qx 0
          # Password policy.
          grep -qE '^PASS_MAX_DAYS[[:space:]]+90' /etc/login.defs
          grep -q 'minlen = 12' /etc/security/pwquality.conf
          grep -q 'deny = 5' /etc/security/faillock.conf
          # Prohibited software: nmap is listed by name, and nothing was removed without a pick.
          grep -q 'nmap' apply.txt
          dpkg -s nmap >/dev/null 2>&1
      - name: Debug dump (always runs)
        if: always()
        run: |
          echo "--- sshd -t on the restored config:"; sudo sshd -t 2>&1; echo "rc=$?"
          echo "--- sshd_config (restored):"; sudo cat /etc/ssh/sshd_config
          echo "--- sshd_config.d:"; sudo ls -la /etc/ssh/sshd_config.d/ 2>&1; sudo cat /etc/ssh/sshd_config.d/*.conf 2>/dev/null
          echo "--- run folder command log:"; sudo sh -c 'cat /root/cp-reports/run-*/commands.log' 2>/dev/null | tail -n 60
          echo "--- run folder run.log:"; sudo sh -c 'cat /root/cp-reports/run-*/run.log' 2>/dev/null | tail -n 60
          echo "--- /run/sshd:"; ls -ld /run/sshd 2>&1
